[project]
name = "reservations"
description = "Open source reservation system written in Django"
authors = [{ name = "Gregor Jerše", email = "gregor@jerse.info" }, { name = "Gašper Fele-Žorž", email = "polz@not.si" }]
dynamic = ["version"]
license = "GPL-3.0-or-later"
requires-python = ">=3.13, <3.15"
dependencies = [
    "Django~=5.2.8",
    "django-guardian~=3.2.0",
    "djangorestframework~=3.16.1",
    "django-filter~=25.2",
    "django-debug-toolbar~=6.1.0",
    "crispy-bootstrap5>=2025.6",
    "psycopg>=3.2.12",
    "django-environ>=0.12.0",
    "requests~=2.32.0",
    "social-auth-app-django>=5.7.0",
    "django-import-export>=4.4.0",
    "django-tomselect>=2026.4.1",
    "django-htmx>=1.27.0",
    "django-admin-sortable2>=2.3.1",
    "tqdm>=4.67.1",
]

[tool.black]
line-length = 120

[dependency-groups]
dev = [
    "black>=26.3.1",
    "django-types>=0.23.0",
    "isort>=8.0.1",
    "jupyter[lab]>=1.1.1",
    "pytest>=9.0.3",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
    # "xsdata[cli,lxml]>=26.2",
]
production = [
    "hypercorn>=0.18.0",
    "psycopg>=3.2.12",
]
