{% extends 'reservations/base.html' %}
{% load static %}
{% block title %}Reservations Calendar - Rezervacije{% endblock %}

{% block nav_middle %}
<div class="gap-2" id="date-picker-container">
    <button class="btn btn-sm btn-outline-light" id="prev-date-btn">
        ⏴
    </button>
    <input type="date" class="form-control form-control-sm" id="calendar-date">
    <button class="btn btn-sm btn-outline-light" id="next-date-btn">
        ⏵
    </button>
</div>
{% endblock %}

{% block content %}
<!-- Timeline Container -->
<div id="timeline-container"></div>

<!-- Reservation Modal -->
<div class="modal fade" id="reservationModal" tabindex="-1" aria-labelledby="reservationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reservationModalLabel">Reservation Form</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="reservation-form-container">
                    <!-- Form will be loaded here -->
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
window.RESERVABLE_SET_SLUG = "{{ reservable_set_slug }}"
window.RESERVABLE_TYPE_SLUG = "{{ reservable_type_slug }}"
</script>
<script type="text/javascript" src="https://unpkg.com/vis-timeline@8.1.0/standalone/umd/vis-timeline-graph2d.min.js"></script>
<script src="{% static 'js/timeline.js' %}"></script>
{% endblock %}
